<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pokemon Team Builder</title>
<link rel="stylesheet" href="css/pokemon.css">
</head>

<body>

<div class="container">

<h2>Pokemon Team Builder</h2>

<input type="text" id="pokemonInput" placeholder="Enter Pokemon ID or Name">
<button id="fetchBtn">Submit</button>

<hr>

<div id="pokemonDisplay">
    <img id="pokemonImagePlaceholder" src="https://via.placeholder.com/200?text=No+Pokemon" alt="placeholder">
</div>

<div id="moveSelectors"></div>

<br>

<button id="addTeamBtn">Add to Team</button>

<h3>Your Team</h3>
<div id="teamDisplay"></div>

</div>

<script src="js/pokemon.js"></script>
</body>
</html>
